[build-system]
requires = ["setuptools>=65.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgrasolve"
dynamic = ["version"]
description = "A modular CGRA mapping framework with pluggable algorithms"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "CGRA-Solve Contributors"}
]
keywords = ["cgra", "mapping", "scheduling", "placement", "routing", "reconfigurable"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = [
    "numpy>=1.20.0",
    "networkx>=3.5",
    "pyyaml>=5.4",
    "typing-extensions>=4.0.0",
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "matplotlib>=3.3",
    "graphviz>=0.16",
    "scipy>=1.6",
    "pulp>=2.5",
    "gurobipy>=12.0.3",
    "pyomo>=6.9.5",
    "torch>=1.10",
    "torch-geometric>=2.0",
]

[project.scripts]
cgrasolve = "cgrasolve.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/CGRA-Solve"
Documentation = "https://cgrasolve.readthedocs.io"
Repository = "https://github.com/yourusername/CGRA-Solve"
Issues = "https://github.com/yourusername/CGRA-Solve/issues"

[tool.setuptools]
packages.find = {where = ["src"]}
package-dir = {"" = "src"}

[tool.setuptools.package-data]
cgrasolve = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools_scm]
write_to = "src/cgrasolve/_version.py"
